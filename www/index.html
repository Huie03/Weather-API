<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather API</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

<div class="app-container">
    <div class="app-header">
        <h1>☁️ Weather Details</h1>
        <p>Real-time weather information</p>
    </div>

    <div class="app-content">
        <label class="input-label">Enter Location</label>
        <div class="input-wrapper">
            <input type="text" id="locationInput" placeholder="Kuala terengganu">
        </div>

        <button class="btn-fetch" id="fetchButton">Get Weather Info</button>

        <table class="data-table" id="weatherDisplay" style="display: none;">
            <tr><th>📍 Location</th><td id="location"></td></tr>
            <tr><th>📅 Date</th><td id="date"></td></tr>
            <tr><th>🕒 Time</th><td id="time"></td></tr>
            <tr><th>☁️ Weather</th><td id="weather"></td></tr>
            <tr><th>🌡️ Temp (Kelvin)</th><td id="temperatureK"></td></tr>
            <tr><th>🌡️ Temp (Celsius)</th><td id="temperatureC" class="celsius-highlight"></td></tr>
            <tr><th>🌅 Sunrise</th><td id="sunrise"></td></tr>
            <tr><th>🌇 Sunset</th><td id="sunset"></td></tr>
        </table>
    </div>

    <div class="footer-credit">Data provided by OpenWeatherMap</div>
</div>

<script>
$(document).ready(function() {
    $('#fetchButton').click(function() {
        var city = $('#locationInput').val();
        var myKey = "a5eefcb24d08b3c5e8fc4eeaac7d95c9"; // Your working key
        var url = "https://api.openweathermap.org/data/2.5/weather?q=" + city + "&APPID=" + myKey;

        $.ajax({
            url: url,
            success: function(data) {
                // Parsing logic from slides
                var d = new Date(data.dt * 1000);
                var sr = new Date(data.sys.sunrise * 1000);
                var ss = new Date(data.sys.sunset * 1000);
                
                // Displaying values
                $("#location").html(data.name + ", " + data.sys.country);
                $("#date").html(d.toDateString());
                $("#time").html(d.toLocaleTimeString());
                $("#weather").html(data.weather[0].main + " (" + data.weather[0].description + ")");
                $("#temperatureK").html(data.main.temp + " K");
                
                // Math conversion for Celsius[cite: 1]
                var c = (data.main.temp - 273.15).toFixed(2);
                $("#temperatureC").html(c + " °C");
                
                $("#sunrise").html(sr.toLocaleTimeString());
                $("#sunset").html(ss.toLocaleTimeString());
                
                $("#weatherDisplay").fadeIn();
            },
            error: function() {
                alert("Please check city name and connection.");
            }
        });
    });
});
</script>

</body>
</html>
